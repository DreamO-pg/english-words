name: Check

# Те же проверки, что и перед деплоем, но на каждом pull request:
# сломанный словарь, движок или хранение видно до мержа, а не после.
# Деплоя здесь нет — он только в deploy.yml по push в main.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Линтер, check:words, check:engine, check:storage
      - run: npm run check
      # tsc --noEmit и vite build — сборка тоже должна проходить
      - run: npm run build
